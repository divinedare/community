<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Real Purple Pages | A Divine Dare Community Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      /* Cover palette */
      --cover-bg: #2A0050;
      --cover-mid: #4A0082;
      --cover-text: #F0D893;
      --cover-gold: #D4AF37;
      --cover-gold-glow: rgba(212,175,55,0.4);

      /* Inner page palette */
      --page-bg: #F2EBFF;
      --page-bg-2: #E8DBFF;
      --page-text: #1A0033;
      --page-purple: #5B1E9C;
      --page-purple-light: #8A4BC8;
      --page-gold: #7A5A00;
      --page-divider: rgba(91,30,156,0.15);
      --page-listing-border: rgba(91,30,156,0.12);

      /* Shared */
      --gold: #D4AF37;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #1A0033;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 12px 40px;
    }

    /* ── Book wrapper ── */
    .book-wrap {
      width: 100%;
      max-width: 680px;
      position: relative;
    }

    /* ── COVER ── */
    #coverPage {
      background: linear-gradient(160deg, #1A0033 0%, #3D0070 40%, #5A008A 65%, #1A0033 100%);
      border-radius: 6px 2px 2px 6px;
      min-height: 88vh;
      position: relative;
      overflow: hidden;
      box-shadow:
        -6px 0 16px rgba(0,0,0,0.5),
        6px 0 24px rgba(0,0,0,0.35),
        inset -4px 0 12px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }

    /* Spine strip */
    #coverPage::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 22px;
      background: linear-gradient(90deg, #0D001A, #2A005C 60%, transparent);
      z-index: 2;
    }

    /* Gold corner arc */
    #coverPage::after {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: conic-gradient(from 200deg, transparent 50%, rgba(212,175,55,0.18) 60%, rgba(212,175,55,0.06) 75%, transparent 85%);
      z-index: 1;
    }

    /* Stars canvas behind cover */
    #coverCanvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .cover-content {
      position: relative;
      z-index: 3;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 36px 28px 0;
      flex: 1;
    }

    .cover-eyebrow {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: var(--cover-gold);
      opacity: 0.85;
      letter-spacing: 0.02em;
      text-align: center;
      margin-bottom: 4px;
    }

    .cover-title-wrap {
      text-align: center;
      margin-bottom: 6px;
    }

    .cover-the {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 400;
      color: var(--cover-gold);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.75;
      display: block;
    }

    .cover-real {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 2.8rem);
      color: var(--cover-text);
      display: block;
      line-height: 1;
      text-shadow: 0 0 30px rgba(212,175,55,0.4), 0 2px 4px rgba(0,0,0,0.5);
    }

    .cover-purple-pages {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 900;
      line-height: 0.9;
      display: block;
      background: linear-gradient(135deg, #F0D893 0%, #D4AF37 35%, #F0D893 60%, #C9A227 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 2px 8px rgba(212,175,55,0.5));
      letter-spacing: 0.02em;
    }

    .cover-tagline {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.65rem, 2vw, 0.85rem);
      color: rgba(240,216,147,0.7);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .cover-divider {
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 18px 0;
      opacity: 0.5;
    }

    /* Design space */
    .cover-design-space {
      width: 85%;
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(212,175,55,0.04);
    }

    .cover-design-space-label {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: rgba(212,175,55,0.35);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .cover-diamond {
      color: rgba(212,175,55,0.2);
      font-size: 2rem;
    }

    .cover-bottom {
      position: relative;
      z-index: 3;
      width: 100%;
      padding: 16px 28px 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .cover-edition {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      color: rgba(212,175,55,0.45);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1.6;
    }

    /* ── Animated Finger ── */
    .finger-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
      padding: 8px;
    }

    .finger-icon {
      font-size: 2.2rem;
      animation: fingerBounce 0.9s ease-in-out infinite;
      display: block;
      user-select: none;
    }

    .finger-icon.left-finger {
      animation: fingerBounceLeft 0.9s ease-in-out infinite;
    }

    @keyframes fingerBounce {
      0%, 100% { transform: translateX(0) rotate(-5deg); }
      30% { transform: translateX(6px) rotate(5deg); }
      60% { transform: translateX(3px) rotate(-3deg); }
    }

    @keyframes fingerBounceLeft {
      0%, 100% { transform: translateX(0) rotate(5deg); }
      30% { transform: translateX(-6px) rotate(-5deg); }
      60% { transform: translateX(-3px) rotate(3deg); }
    }

    .finger-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      color: var(--cover-gold);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* ── INNER PAGES ── */
    #innerSection {
      display: none;
    }

    /* Search bar */
    .search-bar-wrap {
      background: linear-gradient(90deg, #3D0070, #5A008A);
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border-radius: 0;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .search-logo {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 20px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      padding: 8px 36px 8px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: rgba(255,255,255,0.45); }

    .search-clear-inner {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      font-size: 0.9rem;
      display: none;
    }

    .search-clear-inner.visible { display: block; }

    /* Page */
    .dir-page {
      background: var(--page-bg);
      min-height: 80vh;
      position: relative;
      border-top: 3px solid var(--cover-gold);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Page flip animation */
    .page-flip-forward {
      animation: flipForward 0.35s ease-out;
    }

    .page-flip-back {
      animation: flipBack 0.35s ease-out;
    }

    @keyframes flipForward {
      from { opacity: 0.3; transform: perspective(800px) rotateY(-12deg) translateX(20px); }
      to   { opacity: 1;   transform: perspective(800px) rotateY(0deg)   translateX(0); }
    }

    @keyframes flipBack {
      from { opacity: 0.3; transform: perspective(800px) rotateY(12deg) translateX(-20px); }
      to   { opacity: 1;   transform: perspective(800px) rotateY(0deg)  translateX(0); }
    }

    /* Page header strip */
    .page-header-strip {
      background: linear-gradient(90deg, #3D0070 0%, #5A008A 50%, #3D0070 100%);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-section-label {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .page-number-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      color: rgba(212,175,55,0.65);
      letter-spacing: 0.1em;
    }

    /* Listings container */
    .listings-wrap {
      padding: 0;
    }

    /* Individual listing */
    .listing {
      border-bottom: 1px solid var(--page-listing-border);
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      position: relative;
      transition: background 0.1s;
    }

    .listing:hover { background: rgba(91,30,156,0.04); }

    .listing:last-child { border-bottom: none; }

    /* Gold bar on left of listing */
    .listing::before {
      content: '';
      position: absolute;
      left: 0; top: 14px; bottom: 14px;
      width: 3px;
      background: linear-gradient(180deg, var(--gold), transparent);
      opacity: 0.5;
      border-radius: 2px;
    }

    .listing-photos {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .listing-photo {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid rgba(91,30,156,0.2);
      background: var(--page-bg-2);
    }

    .listing-body {
      flex: 1;
      min-width: 0;
    }

    .listing-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.92rem, 2.5vw, 1.05rem);
      font-weight: 700;
      color: var(--page-purple);
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .listing-known-as {
      font-family: 'Dancing Script', cursive;
      font-size: 0.88rem;
      color: var(--page-purple-light);
      margin-bottom: 5px;
      display: block;
    }

    .listing-offer {
      font-size: 0.8rem;
      color: #3A1A55;
      line-height: 1.55;
      margin-bottom: 8px;
    }

    .listing-links {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .listing-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: opacity 0.12s;
    }

    .listing-pill:hover { opacity: 0.8; }

    .listing-pill.web {
      background: rgba(91,30,156,0.12);
      border: 1px solid rgba(91,30,156,0.22);
      color: var(--page-purple);
    }

    .listing-pill.social {
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.25);
      color: var(--page-gold);
    }

    .listing-pill i { font-size: 0.7rem; }

    /* ── Page navigation ── */
    .page-nav {
      background: linear-gradient(90deg, #2A0050, #3D0070 50%, #2A0050);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-finger-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 6px 10px;
      outline: none;
      min-width: 60px;
    }

    .nav-finger-btn:disabled {
      opacity: 0.25;
      pointer-events: none;
    }

    .nav-finger-icon {
      font-size: 1.6rem;
      display: block;
      animation: fingerBounce 0.9s ease-in-out infinite;
    }

    .nav-finger-icon.left-finger {
      animation: fingerBounceLeft 0.9s ease-in-out infinite;
    }

    .nav-label {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .page-counter {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: rgba(212,175,55,0.65);
      text-align: center;
      letter-spacing: 0.08em;
    }

    /* Empty state */
    .empty-state {
      padding: 50px 24px;
      text-align: center;
    }

    .empty-state p {
      font-family: 'Cinzel', serif;
      color: var(--page-purple-light);
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Results info bar */
    .results-info {
      padding: 8px 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      color: rgba(91,30,156,0.6);
      background: var(--page-bg);
      border-bottom: 1px solid var(--page-listing-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .clear-search-btn {
      background: none; border: none;
      color: var(--page-purple-light);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      text-decoration: underline;
      display: none;
    }

    .clear-search-btn.visible { display: inline; }

    /* ── Responsive ── */
    @media (min-width: 600px) {
      body { padding: 24px 20px 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .finger-icon, .nav-finger-icon { animation: none; }
      .page-flip-forward, .page-flip-back { animation: none; }
    }
  </style>
</head>
<body>

<div class="book-wrap">

  <!-- ── COVER ── -->
  <div id="coverPage">
    <canvas id="coverCanvas"></canvas>

    <div class="cover-content">
      <div class="cover-eyebrow">A Divine Dare Studio presents</div>

      <div class="cover-title-wrap">
        <span class="cover-the">The</span>
        <span class="cover-real">Real</span>
        <span class="cover-purple-pages">Purple<br>Pages</span>
        <div class="cover-tagline">Community Directory</div>
      </div>

      <div class="cover-divider"></div>

      <!-- Space left for custom design work -->
      <div class="cover-design-space">
        <div class="cover-diamond">◆</div>
        <div class="cover-design-space-label">Your design space</div>
        <div class="cover-design-space-label" style="opacity:0.5;">Add your logo, imagery,<br>or edition details here</div>
        <div class="cover-diamond">◆</div>
      </div>
    </div>

    <div class="cover-bottom">
      <div class="cover-edition">
        A Divine Dare Studio<br>
        Creator Community
      </div>
      <button class="finger-btn" id="openDirBtn">
        <span class="finger-icon">☞</span>
        <span class="finger-label">Open</span>
      </button>
    </div>
  </div>

  <!-- ── INNER DIRECTORY SECTION ── -->
  <div id="innerSection">

    <!-- Sticky search bar -->
    <div class="search-bar-wrap">
      <div class="search-logo">Purple Pages</div>
      <div class="search-input-wrap">
        <input class="search-input" id="searchInput" type="text" placeholder="Search by name, craft, or offer..." autocomplete="off" />
        <button class="search-clear-inner" id="searchClearBtn">✕</button>
      </div>
    </div>

    <!-- Directory page (reused, content swapped) -->
    <div class="dir-page" id="dirPage">
      <div class="page-header-strip">
        <span class="page-section-label" id="sectionLabel">Community Members</span>
        <span class="page-number-badge" id="pageNumberBadge">Page 1</span>
      </div>

      <div class="results-info" id="resultsInfo">
        <span id="resultsCount">Loading...</span>
        <button class="clear-search-btn" id="clearSearchBtn">Clear search</button>
      </div>

      <div class="listings-wrap" id="listingsWrap">
        <div class="empty-state"><p>Loading the community...</p></div>
      </div>

      <div class="page-nav" id="pageNav">
        <button class="nav-finger-btn" id="prevBtn" disabled>
          <span class="nav-finger-icon left-finger">☜</span>
          <span class="nav-label">Prev</span>
        </button>
        <div class="page-counter" id="pageCounter">— / —</div>
        <button class="nav-finger-btn" id="nextBtn">
          <span class="nav-finger-icon">☞</span>
          <span class="nav-label">Next</span>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  // ── Config ──
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZOFYPib4sTBV8tH1EqDHWAXbdYshvorYedFZs8aF_B9AofcMM1Z7iWrgcSIjfOMEOt0Kx0oRJLgvu/pub?output=csv';
  const PAGE_SIZE = 5;

  // ── Social icon map ──
  const SOCIAL_ICONS = {
    'instagram': 'fa-brands fa-instagram',
    'tiktok': 'fa-brands fa-tiktok',
    'facebook': 'fa-brands fa-facebook',
    'facebook page': 'fa-brands fa-facebook',
    'facebook group': 'fa-brands fa-facebook-f',
    'pinterest': 'fa-brands fa-pinterest',
    'youtube': 'fa-brands fa-youtube',
    'twitter / x': 'fa-brands fa-x-twitter',
    'threads': 'fa-brands fa-threads',
    'linkedin': 'fa-brands fa-linkedin',
    'snapchat': 'fa-brands fa-snapchat',
  };

  // ── State ──
  let allMembers = [];
  let filteredMembers = [];
  let currentPage = 0;
  let isOpen = false;
  let lastDirection = 'forward';

  // ── DOM refs ──
  const coverPage       = document.getElementById('coverPage');
  const innerSection    = document.getElementById('innerSection');
  const openDirBtn      = document.getElementById('openDirBtn');
  const dirPage         = document.getElementById('dirPage');
  const listingsWrap    = document.getElementById('listingsWrap');
  const pageNav         = document.getElementById('pageNav');
  const prevBtn         = document.getElementById('prevBtn');
  const nextBtn         = document.getElementById('nextBtn');
  const pageCounter     = document.getElementById('pageCounter');
  const pageNumberBadge = document.getElementById('pageNumberBadge');
  const sectionLabel    = document.getElementById('sectionLabel');
  const searchInput     = document.getElementById('searchInput');
  const searchClearBtn  = document.getElementById('searchClearBtn');
  const clearSearchBtn  = document.getElementById('clearSearchBtn');
  const resultsCount    = document.getElementById('resultsCount');
  const resultsInfo     = document.getElementById('resultsInfo');

  // ── Cover canvas stars ──
  (function() {
    const canvas = document.getElementById('coverCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resize();
    const stars = Array.from({length: 90}, () => ({
      x: Math.random(), y: Math.random(),
      r: 0.3 + Math.random() * 1.0,
      isDiamond: Math.random() < 0.08,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.6,
      isGold: Math.random() < 0.1,
    }));
    let last = 0;
    function draw(ts) {
      const dt = (ts - last) / 1000; last = ts;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.phase += dt * s.speed;
        const tw = 0.5 + 0.5 * (1 + Math.sin(s.phase)) * 0.5;
        const alpha = 0.06 + tw * 0.38;
        const sx = s.x * canvas.width, sy = s.y * canvas.height;
        if (s.isDiamond) {
          const size = s.r * 3.2;
          ctx.save(); ctx.translate(sx, sy);
          ctx.rotate(Math.PI / 4 * Math.sin(s.phase * 0.3));
          ctx.fillStyle = s.isGold ? `rgba(212,175,55,${alpha})` : `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(0,-size); ctx.quadraticCurveTo(size*0.15,-size*0.15,size,0);
          ctx.quadraticCurveTo(size*0.15,size*0.15,0,size);
          ctx.quadraticCurveTo(-size*0.15,size*0.15,-size,0);
          ctx.quadraticCurveTo(-size*0.15,-size*0.15,0,-size);
          ctx.closePath(); ctx.fill(); ctx.restore();
        } else {
          const g = ctx.createRadialGradient(sx,sy,0,sx,sy,s.r*5);
          const c = s.isGold ? 'rgba(212,175,55,' : 'rgba(255,255,255,';
          g.addColorStop(0, c+alpha+')'); g.addColorStop(1, c+'0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(sx,sy,s.r*5,0,Math.PI*2); ctx.fill();
        }
      });
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();

  // ── Open directory ──
  openDirBtn.addEventListener('click', () => {
    coverPage.style.display = 'none';
    innerSection.style.display = 'block';
    isOpen = true;
    loadData();
  });

  // ── Load data from Sheet ──
  async function loadData() {
    listingsWrap.innerHTML = '<div class="empty-state"><p>Summoning the community...</p></div>';
    try {
      const res = await fetch(SHEET_CSV_URL);
      const text = await res.text();
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      allMembers = parsed.data
        .filter(r => r['Name'] && r['Name'].trim())
        .map(parseRow)
        .sort((a, b) => a.name.localeCompare(b.name));
      filteredMembers = allMembers;
      currentPage = 0;
      renderPage();
    } catch(e) {
      listingsWrap.innerHTML = '<div class="empty-state"><p>Couldn\'t reach the directory — check the CSV URL.</p></div>';
    }
  }

  function parseRow(r) {
    let websites = [], socials = [];
    try { websites = JSON.parse(r['Websites'] || '[]'); } catch(e) {}
    try { socials   = JSON.parse(r['Socials']  || '[]'); } catch(e) {}
    return {
      name:     (r['Name']          || '').trim(),
      nickname: (r['Nickname']      || '').trim(),
      offer:    (r['What You Offer']|| '').trim(),
      photo1:   (r['Photo1']        || '').trim(),
      photo2:   (r['Photo2']        || '').trim(),
      websites: websites.filter(w => w.type || w.url).sort((a,b) => (a.type||'').localeCompare(b.type||'')),
      socials:  socials.filter(s => s.type || s.handle).sort((a,b) => (a.type||'').localeCompare(b.type||'')),
    };
  }

  function buildSocialUrl(s) {
    const h = (s.handle || '').trim();
    if (!h) return '#';
    if (h.startsWith('http') || h.startsWith('www.')) return h.startsWith('www.') ? 'https://'+h : h;
    const slug = h.replace('@','');
    const p = (s.type || '').toLowerCase();
    if (p.includes('instagram'))  return `https://instagram.com/${slug}`;
    if (p.includes('tiktok'))     return `https://tiktok.com/@${slug}`;
    if (p.includes('facebook'))   return `https://facebook.com/${slug}`;
    if (p.includes('pinterest'))  return `https://pinterest.com/${slug}`;
    if (p.includes('youtube'))    return `https://youtube.com/@${slug}`;
    if (p.includes('twitter') || p.includes('x')) return `https://x.com/${slug}`;
    if (p.includes('threads'))    return `https://threads.net/@${slug}`;
    if (p.includes('linkedin'))   return `https://linkedin.com/in/${slug}`;
    return '#';
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Render current page ──
  function renderPage(direction) {
    const total = filteredMembers.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const start = currentPage * PAGE_SIZE;
    const end   = Math.min(start + PAGE_SIZE, total);
    const pageMembers = filteredMembers.slice(start, end);

    // Animate
    if (direction) {
      dirPage.classList.remove('page-flip-forward','page-flip-back');
      void dirPage.offsetWidth;
      dirPage.classList.add(direction === 'forward' ? 'page-flip-forward' : 'page-flip-back');
    }

    // Results info
    const query = searchInput.value.trim();
    if (query) {
      resultsCount.textContent = `${total} result${total !== 1 ? 's' : ''} for "${query}"`;
      clearSearchBtn.classList.add('visible');
    } else {
      resultsCount.textContent = `${total} member${total !== 1 ? 's' : ''} in the community`;
      clearSearchBtn.classList.remove('visible');
    }

    // Section label / page badge
    sectionLabel.textContent = query ? 'Search Results' : 'Community Members';
    pageNumberBadge.textContent = `Page ${currentPage + 1} of ${totalPages}`;
    pageCounter.textContent = `${currentPage + 1} / ${totalPages}`;

    // Nav
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;

    // Listings
    if (total === 0) {
      listingsWrap.innerHTML = '<div class="empty-state"><p>No members match — try a different search.</p></div>';
      return;
    }

    listingsWrap.innerHTML = pageMembers.map(m => buildListing(m)).join('');
  }

  function buildListing(m) {
    // Photos
    const photos = [m.photo1, m.photo2].filter(Boolean);
    const photosHtml = photos.length ? `
      <div class="listing-photos">
        ${photos.map(p => `<img class="listing-photo" src="${esc(p)}" alt="Photo" onerror="this.style.display='none'" />`).join('')}
      </div>` : '';

    // Website pills
    const webPills = m.websites.map(w => {
      const url = w.url ? (w.url.startsWith('http') ? w.url : 'https://'+w.url) : '#';
      return `<a class="listing-pill web" href="${esc(url)}" target="_blank" rel="noopener">
        <i class="fa-solid fa-globe" style="font-size:0.65rem;"></i>${esc(w.type || 'Site')}
      </a>`;
    }).join('');

    // Social pills
    const socialPills = m.socials.map(s => {
      const url = buildSocialUrl(s);
      const iconClass = SOCIAL_ICONS[(s.type||'').toLowerCase()];
      const iconHtml = iconClass ? `<i class="${iconClass}" style="font-size:0.7rem;"></i>` : '';
      return `<a class="listing-pill social" href="${esc(url)}" target="_blank" rel="noopener">${iconHtml}${esc(s.type || 'Social')}</a>`;
    }).join('');

    const allPills = webPills + socialPills;
    const hasOffer = m.offer && m.offer !== 'Socials only';

    return `
      <div class="listing">
        ${photosHtml}
        <div class="listing-body">
          <div class="listing-name">${esc(m.name)}</div>
          ${m.nickname ? `<span class="listing-known-as">✦ ${esc(m.nickname)}</span>` : ''}
          ${hasOffer ? `<div class="listing-offer">${esc(m.offer)}</div>` : ''}
          ${allPills ? `<div class="listing-links">${allPills}</div>` : ''}
        </div>
      </div>`;
  }

  // ── Navigation ──
  nextBtn.addEventListener('click', () => {
    const totalPages = Math.ceil(filteredMembers.length / PAGE_SIZE);
    if (currentPage < totalPages - 1) {
      currentPage++;
      renderPage('forward');
      dirPage.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  prevBtn.addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      renderPage('back');
      dirPage.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      // Go back to cover
      innerSection.style.display = 'none';
      coverPage.style.display = 'flex';
    }
  });

  // ── Search ──
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    searchClearBtn.classList.toggle('visible', !!q);
    filteredMembers = q
      ? allMembers.filter(m => `${m.name} ${m.nickname} ${m.offer}`.toLowerCase().includes(q))
      : allMembers;
    currentPage = 0;
    renderPage('forward');
  });

  function clearSearch() {
    searchInput.value = '';
    searchClearBtn.classList.remove('visible');
    filteredMembers = allMembers;
    currentPage = 0;
    renderPage('forward');
  }

  searchClearBtn.addEventListener('click', clearSearch);
  clearSearchBtn.addEventListener('click', clearSearch);
</script>
</body>
</html>
