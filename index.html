<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Real Purple Pages | A Divine Dare Community Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --cover-bg: #1E003A;
      --gold: #D4AF37;
      --gold-light: #F0D893;
      --gold-dim: rgba(212,175,55,0.22);

      /* Inner page — dark, rich, regal */
      --inner-bg: #14002A;
      --inner-surface: #1F0040;
      --inner-surface-2: #280052;
      --inner-text: #E8D0FF;
      --inner-text-dim: #B89ACC;
      --inner-name: #F0D893;
      --inner-divider: rgba(212,175,55,0.15);
      --inner-pill-web-bg: rgba(212,175,55,0.10);
      --inner-pill-web-border: rgba(212,175,55,0.28);
      --inner-pill-web-text: #F0D893;
      --inner-pill-soc-bg: rgba(180,120,255,0.12);
      --inner-pill-soc-border: rgba(180,120,255,0.28);
      --inner-pill-soc-text: #D4AAFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0D001E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body > *:not(#bgStarCanvas) { position: relative; z-index: 1; }

    .book-wrap {
      width: 100%;
      max-width: 700px;
      perspective: 1000px;
    }

    /* ─────────────────────────────── COVER ─── */
    #coverPage {
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 20%, #5A0090 0%, #2E0058 35%, #1A0033 70%, #0D001E 100%);
      transform: perspective(1000px) rotateY(-2.5deg) rotateX(0.4deg);
      box-shadow:
        /* Page depth strips on right */
        6px 0 0 #1A0030,
        12px 2px 0 #110022,
        18px 4px 0 #0A0016,
        /* Elevation shadow */
        22px 28px 50px rgba(0,0,0,0.9),
        /* Purple ambient glow */
        -4px 4px 35px rgba(90,0,160,0.45),
        0 0 60px rgba(80,0,150,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Spine */
    #coverPage::before {
      content:'';
      position: absolute;
      left:0; top:0; bottom:0; width:18px;
      background: linear-gradient(90deg,#06000F,#280050 70%, transparent);
      z-index:2;
    }

    #coverCanvas { position:absolute; inset:0; z-index:1; pointer-events:none; }

    /* Shooting star trail */
    .shoot-canvas { position:absolute; inset:0; z-index:1; pointer-events:none; }

    .cover-main {
      position: relative;
      z-index: 3;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 28px 20px;
      gap: 0;
    }

    .cover-eyebrow {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1rem, 3vw, 1.3rem);
      color: var(--gold);
      opacity: 0.8;
      text-align: center;
      margin-bottom: 10px;
    }

    .cover-the {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.75rem, 2vw, 0.9rem);
      font-weight: 400;
      color: var(--gold-light);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.65;
      display: block;
      text-align: center;
    }

    .cover-real {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      color: var(--gold-light);
      display: block;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 40px rgba(212,175,55,0.5);
    }

    .cover-purple-pages {
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 900;
      line-height: 0.88;
      display: block;
      text-align: center;
      color: #F0D893;
      letter-spacing: 0.015em;
      text-shadow:
        0 0 18px rgba(160, 80, 255, 0.97),
        0 0 40px rgba(120, 40, 220, 0.68),
        0 0 70px rgba(100, 20, 200, 0.42),
        0 0 100px rgba(80, 0, 200, 0.22),
        0 3px 6px rgba(0, 0, 0, 0.6);
    }

    .cover-subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.6rem, 1.8vw, 0.78rem);
      letter-spacing: 0.28em;
      color: rgba(240,216,147,0.6);
      text-transform: uppercase;
      margin-top: 8px;
      text-align: center;
    }

    .cover-rule {
      width: 75%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 20px 0;
      opacity: 0.45;
    }

    /* Community blurb on cover */
    /* Cover CTA buttons */
    .cover-btns {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
    }

    .cover-btn-gold {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 12px 24px;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      border: none;
      background: linear-gradient(135deg, #D4AF37, #B8902C);
      color: #1A0033;
      box-shadow: 0 6px 20px rgba(212,175,55,0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .cover-btn-gold:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(212,175,55,0.55); }

    .cover-btn-outline {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 11px 24px;
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      background: transparent;
      border: 1px solid rgba(212,175,55,0.5);
      color: var(--gold-light);
      transition: border-color 0.12s, transform 0.12s;
    }

    .cover-btn-outline:hover { border-color: var(--gold); transform: translateY(-2px); }

    /* Design space */
    .cover-design-space {
      width: 80%;
      max-width: 400px;
      border: 1px solid rgba(212,175,55,0.18);
      border-radius: 3px;
      padding: 18px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(212,175,55,0.03);
      margin-bottom: 20px;
    }

    .ds-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: rgba(212,175,55,0.28);
      text-transform: uppercase;
    }

    /* Cover bottom */
    .cover-bottom {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 12px 20px 20px;
    }

    .cover-edition {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: rgba(212,175,55,0.4);
      text-transform: uppercase;
      line-height: 1.7;
    }

    /* ─────────── Walking Finger Button (Cover) ─── */
    .walk-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px;
      outline: none;
    }

    .walk-btn:focus-visible { outline: 2px solid var(--gold); border-radius: 4px; }

    .walk-btn-label {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Walking hand SVG */
    .walk-hand {
      width: 46px;
      height: 46px;
    }


    /* Finger icon image buttons */
    .finger-img-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .finger-icon-clip {
      width: 70px;
      height: 66px;
      overflow: hidden;
      position: relative;
    }

    .finger-icon-clip img {
      height: 66px;
      width: auto;
      position: absolute;
      top: 0;
    }

    /* Left icon in sprite = right-walking (NEXT / OPEN) */
    .finger-icon-clip.icon-right img { left: 0; }

    /* Right icon in sprite = left-walking (PREV) */
    .finger-icon-clip.icon-left img { right: 0; }

    .nav-icon-label {
      font-family: 'Cinzel', serif;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
    }

    /* Walking leg animations */
    @keyframes legFwd {
      from { transform: rotate(-18deg); }
      to   { transform: rotate(8deg);  }
    }
    @keyframes legBack {
      from { transform: rotate(8deg);  }
      to   { transform: rotate(-18deg); }
    }

    /* Whole figure slight walking bob */
    .walk-hand, .nav-hand {
      animation: walkBob 0.7s ease-in-out infinite alternate;
    }
    @keyframes walkBob {
      from { transform: translateY(0);  }
      to   { transform: translateY(3px); }
    }

    /* ─────────────────────────── INNER SECTION ─── */
    #innerSection { display: none; }

    /* Sticky header */
    .inner-header {
      background: linear-gradient(90deg, #1E0038 0%, #380068 50%, #1E0038 100%);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      border-bottom: 1px solid rgba(212,175,55,0.2);
    }

    .header-home-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Dancing Script', cursive;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.02em;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 3px;
      transition: opacity 0.12s;
      text-shadow: 0 0 12px rgba(212,175,55,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-home-btn:hover { opacity: 0.75; }
    .header-home-btn .home-icon { font-size: 0.8rem; opacity: 0.7; }

    .header-search-wrap { flex: 1; position: relative; }

    .header-search {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 20px;
      color: #EDD9FF;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      padding: 8px 34px 8px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .header-search:focus { border-color: var(--gold); }
    .header-search::placeholder { color: rgba(180,140,220,0.55); }

    .search-x {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(180,140,220,0.5);
      cursor: pointer; font-size: 0.88rem;
      display: none;
    }

    .search-x.on { display: block; }

    /* Page strip */
    .page-strip {
      background: linear-gradient(90deg, #200040, #380068 50%, #200040);
      padding: 7px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .strip-section {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .strip-page {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      color: rgba(212,175,55,0.6);
      letter-spacing: 0.1em;
    }

    /* Results bar */
    .results-bar {
      background: var(--inner-surface);
      padding: 6px 14px;
      font-size: 0.72rem;
      color: var(--inner-text-dim);
      border-bottom: 1px solid var(--inner-divider);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: none; border: none;
      color: rgba(180,120,255,0.7);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      text-decoration: underline;
      display: none;
    }

    .clear-btn.on { display: inline; }

    /* Listings */
    .dir-page { background: var(--inner-bg); }

    .listings { }

    .listing {
      border-bottom: 1px solid var(--inner-divider);
      padding: 13px 14px 13px 18px;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      position: relative;
      transition: background 0.12s;
    }

    .listing:hover { background: rgba(255,255,255,0.025); }

    .listing:last-child { border-bottom: none; }

    /* Gold accent bar on left */
    .listing::before {
      content: '';
      position: absolute;
      left: 0; top: 14px; bottom: 14px;
      width: 3px;
      background: linear-gradient(180deg, var(--gold) 0%, rgba(212,175,55,0.2) 100%);
      border-radius: 2px;
    }

    .listing-photos {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }

    .listing-photo {
      width: 56px; height: 56px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid rgba(212,175,55,0.22);
      background: var(--inner-surface-2);
    }

    .listing-body { flex: 1; min-width: 0; }

    .listing-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      font-weight: 700;
      color: var(--inner-name);
      line-height: 1.2;
      margin-bottom: 1px;
    }

    .listing-nickname {
      font-family: 'Dancing Script', cursive;
      font-size: 0.9rem;
      color: rgba(212,175,55,0.7);
      display: block;
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .listing-offer {
      font-size: 0.77rem;
      color: var(--inner-text-dim);
      line-height: 1.55;
      margin-bottom: 4px;
    }

    .listing-offer-text {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.55;
    }

    .listing-offer-text.expanded {
      display: block;
      overflow: visible;
      -webkit-line-clamp: unset;
    }

    .see-toggle {
      background: none;
      border: none;
      color: rgba(228,102,28,0.85);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 0 8px;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 0.04em;
      display: none;
    }

    .see-toggle.visible { display: inline-block; }
    .see-toggle:hover { color: #E4661C; }

    .listing-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lpill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: opacity 0.12s;
    }

    .lpill:hover { opacity: 0.75; }
    .lpill i { font-size: 0.68rem; }

    .lpill.web {
      background: var(--inner-pill-web-bg);
      border: 1px solid var(--inner-pill-web-border);
      color: var(--inner-pill-web-text);
    }

    .lpill.soc {
      background: var(--inner-pill-soc-bg);
      border: 1px solid var(--inner-pill-soc-border);
      color: var(--inner-pill-soc-text);
    }

    /* ── Page Navigation ── */
    .page-nav {
      background: linear-gradient(90deg, #1E0038, #300060 50%, #1E0038);
      border-top: 1px solid rgba(212,175,55,0.18);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-btn {
      background: none;
      border: 1px solid rgba(212,175,55,0.22);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 7px 14px;
      min-width: 72px;
      transition: border-color 0.12s, background 0.12s;
      outline: none;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--gold);
      background: rgba(212,175,55,0.07);
    }

    .nav-btn:disabled { opacity: 0.25; pointer-events: none; }

    .nav-hand { width: 38px; height: 38px; }

    .nav-btn-label {
      font-family: 'Cinzel', serif;
      font-size: 0.56rem;
      letter-spacing: 0.16em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .page-ctr {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      color: rgba(212,175,55,0.6);
      letter-spacing: 0.08em;
    }

    /* ── Animations ── */
    .pf-fwd { animation: pfFwd 0.32s ease-out; }
    .pf-back { animation: pfBack 0.32s ease-out; }

    @keyframes pfFwd {
      from { opacity:0.2; transform: perspective(700px) rotateY(-14deg) translateX(24px); }
      to   { opacity:1;   transform: perspective(700px) rotateY(0)       translateX(0); }
    }

    @keyframes pfBack {
      from { opacity:0.2; transform: perspective(700px) rotateY(14deg) translateX(-24px); }
      to   { opacity:1;   transform: perspective(700px) rotateY(0)     translateX(0); }
    }

    /* Empty state */
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.88rem;
      color: rgba(180,120,255,0.5);
    }

    @media (max-width: 480px) {
      .cover-main { padding: 30px 18px 16px; }
      .cover-btns { gap: 10px; }
      .cover-btn-gold, .cover-btn-outline { font-size: 0.72rem; padding: 10px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wh-f1, .wh-f2 { animation: none; }
      .cover-purple-pages { animation: none; }
      .gem { animation: none; opacity: 0.3; }
      .pf-fwd, .pf-back { animation: none; }
    }
  </style>
</head>
<body>
<div class="book-wrap">

<!-- ══════════════════ COVER ══════════════════ -->
<div id="coverPage">
  <canvas id="coverCanvas"></canvas>

  <div class="cover-main">
    <div class="cover-eyebrow">A Divine Dare Studio presents</div>

    <div style="text-align:center;margin-bottom:4px;">
      <span class="cover-the">The</span>
      <span class="cover-real">Real</span>
      <span class="cover-purple-pages">Purple<br>Pages</span>
      <div class="cover-subtitle">Community Directory</div>
    </div>

    <div class="cover-rule"></div>

    <div class="cover-btns">
      <a href="submit.html" class="cover-btn-gold">✦ Get Listed</a>
      <a href="manage.html" class="cover-btn-outline">Manage My Listing</a>
    </div>

    <div class="cover-design-space">
      <div class="ds-label" style="color:rgba(212,175,55,0.18);">◆ &nbsp; Your design space &nbsp; ◆</div>
      <div class="ds-label" style="opacity:0.4;margin-top:4px;">Add logo · imagery · edition details</div>
    </div>
  </div>

  <div class="cover-bottom">
    <div class="cover-edition">A Divine Dare Studio<br>Creator Community</div>

    <!-- Right walking finger → Open Directory -->
    <button class="walk-btn" id="openDirBtn" aria-label="Open directory">

<script>
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZOFYPib4sTBV8tH1EqDHWAXbdYshvorYedFZs8aF_B9AofcMM1Z7iWrgcSIjfOMEOt0Kx0oRJLgvu/pub?output=csv';
const PAGE_SIZE = 5;

const SICONS = {
  'instagram':'fa-brands fa-instagram','tiktok':'fa-brands fa-tiktok',
  'facebook':'fa-brands fa-facebook','facebook page':'fa-brands fa-facebook',
  'facebook group':'fa-brands fa-facebook-f','pinterest':'fa-brands fa-pinterest',
  'youtube':'fa-brands fa-youtube','twitter / x':'fa-brands fa-x-twitter',
  'threads':'fa-brands fa-threads','linkedin':'fa-brands fa-linkedin',
  'snapchat':'fa-brands fa-snapchat',
};

let all = [], filtered = [], cur = 0;

// DOM
const coverPage    = document.getElementById('coverPage');
const innerSection = document.getElementById('innerSection');
const openDirBtn   = document.getElementById('openDirBtn');
const homeBtn      = document.getElementById('homeBtn');
const dirPage      = document.getElementById('dirPage');
const listingsWrap = document.getElementById('listingsWrap');
const prevBtn      = document.getElementById('prevBtn');
const nextBtn      = document.getElementById('nextBtn');
const pageCtr      = document.getElementById('pageCtr');
const stripSection = document.getElementById('stripSection');
const stripPage    = document.getElementById('stripPage');
const searchInput  = document.getElementById('searchInput');
const searchX      = document.getElementById('searchX');
const clearBtn     = document.getElementById('clearBtn');
const resultsCount = document.getElementById('resultsCount');

// ── Cover canvas: starfield + shooting stars ──
(function(){
  const c = document.getElementById('coverCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  const resize = () => { c.width = c.offsetWidth; c.height = c.offsetHeight; };
  resize();
  window.addEventListener('resize', resize);

  // Fine starfield
  const stars = Array.from({length:130}, () => ({
    x: Math.random(), y: Math.random(),
    r: 0.2 + Math.random() * 0.7,
    isDiamond: Math.random() < 0.07,
    phase: Math.random() * Math.PI * 2,
    speed: 0.2 + Math.random() * 0.5,
    isGold: Math.random() < 0.1,
  }));

  // Shooting stars
  function newShooter() {
    const fromTop = Math.random() < 0.5;
    return {
      x: fromTop ? Math.random() * 0.8 + 0.1 : (Math.random() < 0.5 ? -0.05 : 1.05),
      y: fromTop ? -0.02 : Math.random() * 0.4,
      vx:  0.0028 + Math.random() * 0.0018,
      vy:  0.002  + Math.random() * 0.0015,
      len: 0.18 + Math.random() * 0.14,
      life: 0,
      maxLife: 0.9 + Math.random() * 0.7, // seconds
      width: 1.8 + Math.random() * 1.8,
      // spawn interval before next one
      delay: 0,
    };
  }

  let shooters = [];
  let nextSpawn = 0.8; // first one fires quickly

  let last = 0;
  function draw(ts) {
    const dt = (ts - last) / 1000; last = ts;
    ctx.clearRect(0, 0, c.width, c.height);

    // ── Starfield ──
    stars.forEach(s => {
      s.phase += dt * s.speed;
      const tw = 0.4 + 0.6 * (1 + Math.sin(s.phase)) * 0.5;
      const al = 0.12 + tw * 0.55;
      const sx = s.x * c.width, sy = s.y * c.height;
      if (s.isDiamond) {
        const sz = s.r * 3.2;
        ctx.save(); ctx.translate(sx, sy);
        ctx.rotate(Math.PI / 4 * Math.sin(s.phase * 0.3));
        ctx.fillStyle = s.isGold ? `rgba(212,175,55,${al})` : `rgba(255,255,255,${al})`;
        ctx.beginPath();
        ctx.moveTo(0,-sz); ctx.quadraticCurveTo(sz*.15,-sz*.15,sz,0);
        ctx.quadraticCurveTo(sz*.15,sz*.15,0,sz);
        ctx.quadraticCurveTo(-sz*.15,sz*.15,-sz,0);
        ctx.quadraticCurveTo(-sz*.15,-sz*.15,0,-sz);
        ctx.closePath(); ctx.fill(); ctx.restore();
      } else {
        const g = ctx.createRadialGradient(sx,sy,0,sx,sy,s.r*4.5);
        const bc = s.isGold ? 'rgba(212,175,55,' : 'rgba(255,255,255,';
        g.addColorStop(0, bc+al+')'); g.addColorStop(1, bc+'0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx,sy,s.r*4.5,0,Math.PI*2); ctx.fill();
      }
    });

    // ── Shooting stars ──
    nextSpawn -= dt;
    if (nextSpawn <= 0) {
      shooters.push(newShooter());
      nextSpawn = 1.2 + Math.random() * 1.8; // spawn every 1.2–3 seconds
    }

    shooters = shooters.filter(sh => sh.life < sh.maxLife);
    shooters.forEach(sh => {
      sh.life += dt;
      const progress = sh.life / sh.maxLife;
      const fade = progress < 0.15 ? progress / 0.15 : progress > 0.75 ? 1 - (progress - 0.75) / 0.25 : 1;

      const hx = sh.x * c.width;
      const hy = sh.y * c.height;

      // Tail start (behind)
      const tx = hx - sh.vx * c.width  * 60 * sh.len;
      const ty = hy - sh.vy * c.height * 60 * sh.len;

      // Update position
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;

      // Draw trail: gold → purple → transparent
      const grad = ctx.createLinearGradient(tx, ty, hx, hy);
      grad.addColorStop(0, `rgba(212,175,55,0)`);
      grad.addColorStop(0.4, `rgba(180,100,255,${0.65 * fade})`);
      grad.addColorStop(0.75, `rgba(220,180,255,${0.85 * fade})`);
      grad.addColorStop(1, `rgba(255,240,180,${1.0 * fade})`);

      ctx.save();
      ctx.strokeStyle = grad;
      ctx.lineWidth = sh.width * fade;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(hx, hy);
      ctx.stroke();

      // Sparkle at tip
      const tipGlow = ctx.createRadialGradient(hx,hy,0,hx,hy,4);
      tipGlow.addColorStop(0, `rgba(255,245,200,${0.95 * fade})`);
      tipGlow.addColorStop(0.4, `rgba(200,160,255,${0.5 * fade})`);
      tipGlow.addColorStop(1, `rgba(200,160,255,0)`);
      ctx.fillStyle = tipGlow;
      ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// ── Open / close cover ──
function openDirectory(){
  coverPage.style.display='none';
  innerSection.style.display='block';
  if(!all.length) loadData();
  else renderPage();
}

function goHome(){
  innerSection.style.display='none';
  coverPage.style.display='flex';
}

openDirBtn.addEventListener('click', openDirectory);
homeBtn.addEventListener('click', goHome);

// ── Load data ──
async function loadData(){
  listingsWrap.innerHTML='<div class="empty-state">Summoning the community...</div>';
  try {
    const res = await fetch(SHEET_CSV);
    const text = await res.text();
    const parsed = Papa.parse(text,{header:true,skipEmptyLines:true});

    // Deduplicate by email — keep most recent entry per email
    const byEmail = {};
    parsed.data.filter(r=>r['Name']&&r['Name'].trim()).forEach(r=>{
      const m = parseRow(r);
      const key = (m.email||m.name).toLowerCase();
      byEmail[key] = m; // later row wins (more recent)
    });
    all = Object.values(byEmail).sort((a,b)=>a.name.localeCompare(b.name));
    filtered = all;
    cur = 0;
    renderPage();
  } catch(e){
    listingsWrap.innerHTML='<div class="empty-state">Couldn\'t reach the directory.</div>';
  }
}

function parseRow(r){
  let websites=[],socials=[];
  try{websites=JSON.parse(r['Websites']||'[]');}catch(e){}
  try{socials=JSON.parse(r['Socials']||'[]');}catch(e){}
  return {
    name:    (r['Name']||'').trim(),
    nickname:(r['Nickname']||'').trim(),
    email:   (r['Email']||'').trim(),
    offer:   (r['What You Offer']||'').trim(),
    photo1:  (r['Photo1']||'').trim(),
    photo2:  (r['Photo2']||'').trim(),
    websites: websites.filter(w=>w.type||w.url).sort((a,b)=>(a.type||'').localeCompare(b.type||'')),
    socials:  socials.filter(s=>s.type||s.handle).sort((a,b)=>(a.type||'').localeCompare(b.type||'')),
  };
}

function socialUrl(s){
  const h=(s.handle||'').trim();
  if(!h) return '#';
  if(h.startsWith('http')||h.startsWith('www.')) return h.startsWith('www.')?'https://'+h:h;
  const slug=h.replace('@',''), p=(s.type||'').toLowerCase();
  if(p.includes('instagram'))  return `https://instagram.com/${slug}`;
  if(p.includes('tiktok'))     return `https://tiktok.com/@${slug}`;
  if(p.includes('facebook'))   return `https://facebook.com/${slug}`;
  if(p.includes('pinterest'))  return `https://pinterest.com/${slug}`;
  if(p.includes('youtube'))    return `https://youtube.com/@${slug}`;
  if(p.includes('twitter')||p.includes(' x')) return `https://x.com/${slug}`;
  if(p.includes('threads'))    return `https://threads.net/@${slug}`;
  if(p.includes('linkedin'))   return `https://linkedin.com/in/${slug}`;
  return '#';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Show "See more" only when text is actually clamped
function checkClamps() {
  document.querySelectorAll('.listing-offer-text').forEach(el => {
    const btn = el.nextElementSibling;
    if (btn && btn.classList.contains('see-toggle')) {
      btn.classList.toggle('visible', el.scrollHeight > el.clientHeight + 2);
    }
  });
}

window.toggleOffer = function(btn) {
  const text = btn.previousElementSibling;
  const expanded = text.classList.toggle('expanded');
  btn.textContent = expanded ? 'See less ▴' : 'See more ▾';
  btn.setAttribute('aria-expanded', expanded);
};

// ── Render ──
function renderPage(dir){
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  const start=cur*PAGE_SIZE, end=Math.min(start+PAGE_SIZE,total);
  const members=filtered.slice(start,end);

  if(dir){
    dirPage.classList.remove('pf-fwd','pf-back');
    void dirPage.offsetWidth;
    dirPage.classList.add(dir==='fwd'?'pf-fwd':'pf-back');
  }

  // Results
  const q=searchInput.value.trim();
  if(q){ resultsCount.textContent=`${total} result${total!==1?'s':''} for "${q}"`; clearBtn.classList.add('on'); }
  else { resultsCount.textContent=`${total} member${total!==1?'s':''} in the community`; clearBtn.classList.remove('on'); }

  stripSection.textContent = q ? 'Search Results' : 'Community Members';
  stripPage.textContent = `Page ${cur+1} of ${pages}`;
  pageCtr.textContent = `${cur+1} / ${pages}`;

  // PREV: always enabled (page 1 PREV goes to cover)
  prevBtn.disabled = false;
  nextBtn.disabled = cur>=pages-1;

  if(total===0){
    listingsWrap.innerHTML='<div class="empty-state">No members match — try a different search.</div>';
    return;
  }

  listingsWrap.innerHTML = members.map(buildListing).join('');
  // Check after browser has painted (needed for scrollHeight to be accurate)
  requestAnimationFrame(checkClamps);
}

function buildListing(m){
  const photos=[m.photo1,m.photo2].filter(Boolean);
  const photoHtml = photos.length ? `<div class="listing-photos">${photos.map(p=>`<img class="listing-photo" src="${esc(p)}" alt="" onerror="this.style.display='none'"/>`).join('')}</div>` : '';

  const webPills = m.websites.map(w=>{
    const url=w.url?(w.url.startsWith('http')?w.url:'https://'+w.url):'#';
    return `<a class="lpill web" href="${esc(url)}" target="_blank" rel="noopener"><i class="fa-solid fa-globe"></i>${esc(w.type||'Site')}</a>`;
  }).join('');

  const socPills = m.socials.map(s=>{
    const url=socialUrl(s);
    const ic=SICONS[(s.type||'').toLowerCase()];
    return `<a class="lpill soc" href="${esc(url)}" target="_blank" rel="noopener">${ic?`<i class="${ic}"></i>`:''} ${esc(s.type||'Social')}</a>`;
  }).join('');

  const hasOffer = m.offer && m.offer!=='Socials only';

  return `<div class="listing">
    ${photoHtml}
    <div class="listing-body">
      <div class="listing-name">${esc(m.name)}</div>
      ${m.nickname?`<span class="listing-nickname">✦ ${esc(m.nickname)}</span>`:''}
      ${hasOffer?`<div class="listing-offer"><div class="listing-offer-text" id="offer-${esc(m.email||m.name.replace(/\s/g,''))}">${esc(m.offer)}</div><button class="see-toggle" onclick="toggleOffer(this)" aria-expanded="false">See more ▾</button></div>`:''}
      ${(webPills||socPills)?`<div class="listing-links">${webPills}${socPills}</div>`:''}
    </div>
  </div>`;
}

// ── Navigation ──
nextBtn.addEventListener('click',()=>{
  const pages=Math.ceil(filtered.length/PAGE_SIZE);
  if(cur<pages-1){ cur++; renderPage('fwd'); dirPage.scrollIntoView({behavior:'smooth',block:'start'}); }
});

prevBtn.addEventListener('click',()=>{
  if(cur>0){ cur--; renderPage('back'); dirPage.scrollIntoView({behavior:'smooth',block:'start'}); }
  else { goHome(); } // page 1 PREV → back to cover
});

// ── Search ──
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.toLowerCase().trim();
  searchX.classList.toggle('on',!!q);
  filtered=q?all.filter(m=>`${m.name} ${m.nickname} ${m.offer}`.toLowerCase().includes(q)):all;
  cur=0;
  renderPage('fwd');
});

function clearSearch(){
  searchInput.value=''; searchX.classList.remove('on');
  filtered=all; cur=0; renderPage('fwd');
}

searchX.addEventListener('click',clearSearch);
clearBtn.addEventListener('click',clearSearch);
</script>

  <script>
  // ── Full-page persistent star & shooting-star canvas ──
  (function(){
    const c = document.createElement('canvas');
    c.id = 'bgStarCanvas';
    c.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;';
    document.body.insertBefore(c, document.body.firstChild);
    const ctx = c.getContext('2d');
    const resize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
    resize(); window.addEventListener('resize', resize);

    // Multicolor stars: gold, purple, blue, white
    const COLS = [
      'rgba(212,175,55,',   // gold
      'rgba(180,100,255,',  // purple
      'rgba(110,160,255,',  // blue
      'rgba(255,255,255,',  // white
      'rgba(230,170,255,',  // lavender
    ];

    const stars = Array.from({length:180}, () => ({
      x: Math.random(), y: Math.random(),
      r: 0.25 + Math.random() * 0.85,
      isDiamond: Math.random() < 0.07,
      phase: Math.random() * Math.PI * 2,
      speed: 0.18 + Math.random() * 0.55,
      col: COLS[Math.floor(Math.random() * COLS.length)],
    }));

    let shooters = [], nextSpawn = 0.6, last = 0;

    function newShooter() {
      const fromTop = Math.random() < 0.55;
      return {
        x: fromTop ? Math.random() * 0.75 : -0.05,
        y: fromTop ? -0.02 : Math.random() * 0.35,
        vx: 0.0028 + Math.random() * 0.0022,
        vy: 0.0018 + Math.random() * 0.0016,
        len: 0.14 + Math.random() * 0.13,
        life: 0, maxLife: 0.75 + Math.random() * 0.65,
        w: 1.6 + Math.random() * 1.8,
      };
    }

    function draw(ts) {
      const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
      ctx.clearRect(0, 0, c.width, c.height);

      // Stars
      stars.forEach(s => {
        s.phase += dt * s.speed;
        const tw = 0.45 + 0.55 * (1 + Math.sin(s.phase)) * 0.5;
        const al = 0.1 + tw * 0.5;
        const sx = s.x * c.width, sy = s.y * c.height;
        if (s.isDiamond) {
          const sz = s.r * 3.5;
          ctx.save(); ctx.translate(sx, sy);
          ctx.rotate(Math.PI / 4 * Math.sin(s.phase * 0.4));
          ctx.fillStyle = s.col + al + ')';
          ctx.beginPath();
          ctx.moveTo(0,-sz); ctx.quadraticCurveTo(sz*.14,-sz*.14,sz,0);
          ctx.quadraticCurveTo(sz*.14,sz*.14,0,sz);
          ctx.quadraticCurveTo(-sz*.14,sz*.14,-sz,0);
          ctx.quadraticCurveTo(-sz*.14,-sz*.14,0,-sz);
          ctx.closePath(); ctx.fill(); ctx.restore();
        } else {
          const g = ctx.createRadialGradient(sx,sy,0,sx,sy,s.r*5);
          g.addColorStop(0, s.col + al + ')');
          g.addColorStop(1, s.col + '0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(sx,sy,s.r*5,0,Math.PI*2); ctx.fill();
        }
      });

      // Shooting stars
      nextSpawn -= dt;
      if (nextSpawn <= 0) { shooters.push(newShooter()); nextSpawn = 1.4 + Math.random() * 2.2; }
      shooters = shooters.filter(sh => sh.life < sh.maxLife);
      shooters.forEach(sh => {
        sh.life += dt;
        const p = sh.life / sh.maxLife;
        const fade = p < 0.15 ? p / 0.15 : p > 0.72 ? 1 - (p - 0.72) / 0.28 : 1;
        const hx = sh.x * c.width, hy = sh.y * c.height;
        const tx = hx - sh.vx * c.width  * 55 * sh.len;
        const ty = hy - sh.vy * c.height * 55 * sh.len;
        sh.x += sh.vx * dt; sh.y += sh.vy * dt;

        const grd = ctx.createLinearGradient(tx,ty,hx,hy);
        grd.addColorStop(0,   'rgba(212,175,55,0)');
        grd.addColorStop(0.3, `rgba(150,70,240,${0.65*fade})`);
        grd.addColorStop(0.7, `rgba(210,180,255,${0.88*fade})`);
        grd.addColorStop(1,   `rgba(255,242,165,${fade})`);

        ctx.save();
        ctx.strokeStyle = grd; ctx.lineWidth = sh.w * fade; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(hx,hy); ctx.stroke();

        const tg = ctx.createRadialGradient(hx,hy,0,hx,hy,6);
        tg.addColorStop(0, `rgba(255,248,200,${fade})`);
        tg.addColorStop(1, 'rgba(255,248,200,0)');
        ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(hx,hy,6,0,Math.PI*2); ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  })();
  </script>
